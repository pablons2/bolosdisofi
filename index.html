<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Bolos di Sofi - Confeitaria artesanal em Maceió. Bolos personalizados, caseiros e para eventos. Delivery e encomendas.">

  <title>Bolos di Sofi | Confeitaria Artesanal</title>

  <link rel="icon" href="imgs/logo.png" type="image/png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <meta property="og:title" content="Bolos di Sofi | Confeitaria Artesanal">
  <meta property="og:description" content="Bolos personalizados artesanais em Maceió. Sabor caseiro com toque de sofisticação.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bolosdisofi.com.br">
  <meta property="og:image" content="imgs/logo.png">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-cream: #FFF8F1;
      --color-cream-dark: #F5EDE4;
      --color-chocolate: #5B3A29;
      --color-chocolate-light: #7A5543;
      --color-gold: #C8A46B;
      --color-whatsapp: #25D366;
      --color-whatsapp-dark: #128C7E;
      --color-white: #FFFFFF;
      --color-success: #10B981;
      --color-warning: #F59E0B;

      --font-heading: 'Playfair Display', Georgia, 'Times New Roman', serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      --shadow-sm: 0 2px 8px rgba(91, 58, 41, 0.08);
      --shadow-md: 0 4px 16px rgba(91, 58, 41, 0.12);
      --shadow-lg: 0 8px 32px rgba(91, 58, 41, 0.15);
      --shadow-logo: 0 4px 24px rgba(91, 58, 41, 0.12);

      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--color-cream);
      color: var(--color-chocolate);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    }

    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--color-chocolate);
      color: var(--color-white);
      padding: 8px 16px;
      text-decoration: none;
      z-index: 1001;
      border-radius: 0 0 12px 0;
      font-size: 14px;
      font-weight: 600;
    }

    .skip-link:focus {
      top: 0;
    }

    :focus-visible {
      outline: 2px solid var(--color-gold);
      outline-offset: 2px;
    }

    .hub {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Logo */
    .hub-logo {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--color-white);
      box-shadow: var(--shadow-logo);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .hub-logo img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    /* Brand */
    .hub-brand {
      text-align: center;
      margin-bottom: 16px;
    }

    .hub-brand h1 {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 600;
      color: var(--color-chocolate);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .hub-brand p {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 400;
      color: var(--color-chocolate-light);
      line-height: 1.5;
    }

    /* Status Pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 8px 16px;
      border-radius: 9999px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 4px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9CA3AF;
      transition: background 300ms var(--ease-out);
      flex-shrink: 0;
    }

    .status-dot.open {
      background: var(--color-success);
      animation: pulse 2s infinite;
    }

    .status-dot.closed {
      background: var(--color-warning);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 600;
      color: var(--color-chocolate);
      white-space: nowrap;
    }

    .hours-text {
      font-family: var(--font-body);
      font-size: 12px;
      font-weight: 400;
      color: var(--color-chocolate-light);
      text-align: center;
      margin-bottom: 28px;
    }

    /* Carousel */
    .hub-carousel {
      width: 100%;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow-sm);
      margin-bottom: 28px;
      background: var(--color-cream-dark);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      mask-image: radial-gradient(white, black);
    }

    .carousel-track {
      position: absolute;
      inset: 0;
    }

    .carousel-slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 800ms var(--ease-out);
    }

    .carousel-slide.active {
      opacity: 1;
    }

    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .carousel-slide::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(91,58,41,0) 60%, rgba(91,58,41,0.15) 100%);
    }

    .carousel-dots {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      z-index: 2;
    }

    .carousel-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.5);
      border: none;
      padding: 0;
      cursor: pointer;
      transition: all 300ms var(--ease-out);
    }

    .carousel-dot.active {
      background: var(--color-white);
      width: 18px;
      border-radius: 9999px;
    }

    /* Link Buttons */
    .hub-links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 56px;
      border: none;
      border-radius: 14px;
      font-family: var(--font-body);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 200ms var(--ease-out);
      -webkit-tap-highlight-color: transparent;
    }

    .link-btn:active {
      transform: scale(0.97);
    }

    .link-btn svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .link-btn-primary {
      background: var(--color-chocolate);
      color: var(--color-cream);
      box-shadow: var(--shadow-sm);
    }

    .link-btn-primary:hover {
      background: #6B4A38;
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .link-btn-whatsapp {
      background: var(--color-whatsapp);
      color: var(--color-white);
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.25);
    }

    .link-btn-whatsapp:hover {
      background: var(--color-whatsapp-dark);
      box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35);
      transform: translateY(-1px);
    }

    .link-btn-outline {
      background: transparent;
      border: 2px solid var(--color-chocolate);
      color: var(--color-chocolate);
      height: 52px;
    }

    .link-btn-outline:hover {
      background: rgba(91, 58, 41, 0.06);
    }

    /* Slogan */
    .hub-slogan {
      font-family: var(--font-heading);
      font-size: 14px;
      font-style: italic;
      color: var(--color-chocolate-light);
      text-align: center;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    /* Social Row */
    .hub-social {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      cursor: pointer;
      transition: all 200ms var(--ease-out);
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
    }

    .social-btn:active {
      transform: scale(0.92);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
    }

    .social-btn-instagram {
      background: var(--color-chocolate);
      color: var(--color-cream);
    }

    .social-btn-instagram:hover {
      background: #6B4A38;
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
    }

    .social-btn-share {
      background: transparent;
      border: 2px solid var(--color-chocolate);
      color: var(--color-chocolate);
    }

    .social-btn-share:hover {
      background: rgba(91, 58, 41, 0.06);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--color-chocolate);
      color: var(--color-cream);
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      transition: all 400ms var(--ease-spring);
      z-index: 2000;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* Desktop adjustments */
    @media (min-width: 768px) {
      .hub-logo {
        width: 112px;
        height: 112px;
        margin-bottom: 24px;
      }

      .hub-logo img {
        width: 72px;
        height: 72px;
      }

      .hub-brand h1 {
        font-size: 28px;
      }

      .hub-brand p {
        font-size: 15px;
      }

      .hub-carousel {
        height: 180px;
      }

      .link-btn {
        height: 60px;
        font-size: 17px;
      }

      .link-btn-outline {
        height: 56px;
      }
    }

    /* Reduced motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .carousel-slide {
        transition: none !important;
      }
    }
  </style>
</head>

  <script>
    (function () {
      'use strict';

      // ============================================
      // BUSINESS STATUS
      // ============================================
      var API_URL = 'https://integracao.cardapioweb.com/api/menu/company/profile?company=bolos_di_sofi&hostname=app.oxemenu.com.br';
      var DIAS_SEMANA = {
        sunday: 'Domingo', monday: 'Segunda-feira', tuesday: 'Terça-feira',
        wednesday: 'Quarta-feira', thursday: 'Quinta-feira',
        friday: 'Sexta-feira', saturday: 'Sábado'
      };

      function initBusinessStatus() {
        var statusBar = document.getElementById('status-bar');
        fetch(API_URL)
          .then(function (res) {
            if (!res.ok) throw new Error('API returned ' + res.status);
            return res.json();
          })
          .then(function (data) {
            var hours = data && data.business_hours;
            if (!hours) { showOffline(); return; }
            var today = new Date().toLocaleDateString('en-US', { weekday: 'long' }).toLowerCase();
            var todayHours = hours[today];
            var isOpen = checkIsOpen(todayHours);
            renderStatus(isOpen, todayHours, today, hours);
          })
          .catch(function () { showOffline(); });
      }

      function checkIsOpen(hours) {
        if (!hours || hours.length === 0) return false;
        var now = new Date();
        var currentHour = now.getHours() + (now.getMinutes() / 60);
        var open = parseInt(hours[0][0].split(':')[0]);
        var close = parseInt(hours[0][1].split(':')[0]);
        return currentHour >= open && currentHour < close;
      }

      function renderStatus(isOpen, hours, today, allHours) {
        var dot = document.getElementById('status-dot');
        var text = document.getElementById('status-text');
        var hoursText = document.getElementById('hours-text');

        dot.className = 'status-dot ' + (isOpen ? 'open' : 'closed');
        text.textContent = isOpen ? 'Estamos atendendo' : 'Agendamento disponível';

        if (hoursText) {
          if (hours && hours.length > 0) {
            hoursText.textContent = 'Hoje: ' + hours[0][0] + ' às ' + hours[0][1];
          } else {
            var next = findNextOpenDay(today, allHours);
            if (next) {
              hoursText.textContent = 'Abriremos ' + next.day + ' às ' + next.time;
            }
          }
        }
      }

      function findNextOpenDay(currentDay, businessHours) {
        var days = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
        var idx = days.indexOf(currentDay);
        for (var i = 1; i <= 7; i++) {
          var index = (idx + i) % 7;
          var day = days[index];
          if (businessHours[day] && businessHours[day].length > 0) {
            return { day: DIAS_SEMANA[day], time: businessHours[day][0][0] };
          }
        }
        return null;
      }

      function showOffline() {
        var dot = document.getElementById('status-dot');
        var text = document.getElementById('status-text');
        var hoursText = document.getElementById('hours-text');
        if (dot) dot.style.background = '#9CA3AF';
        if (text) text.textContent = 'Verifique no WhatsApp';
        if (hoursText) hoursText.textContent = 'Horário indisponível';
      }

      // ============================================
      // WEB SHARE API + CLIPBOARD FALLBACK
      // ============================================
      function initShare() {
        var btn = document.getElementById('share-btn');
        if (!btn) return;

        btn.addEventListener('click', function () {
          var shareData = {
            title: 'Bolos di Sofi | Confeitaria Artesanal',
            text: 'Bolos personalizados artesanais em Maceió. Sabor caseiro com toque de sofisticação.',
            url: window.location.href
          };

          if (navigator.share) {
            navigator.share(shareData).catch(function () {});
          } else if (navigator.clipboard) {
            navigator.clipboard.writeText(window.location.href).then(function () {
              showToast('Link copiado!');
            }).catch(function () {
              showToast('Não foi possível copiar');
            });
          } else {
            showToast('Compartilhe: ' + window.location.href);
          }
        });
      }

      function showToast(message) {
        var toast = document.getElementById('toast');
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(function () {
          toast.classList.remove('show');
        }, 2500);
      }

      // ============================================
      // CAROUSEL
      // ============================================
      function initCarousel() {
        var carousel = document.getElementById('carousel');
        if (!carousel) return;

        var track = document.getElementById('carousel-track');
        var dotsContainer = document.getElementById('carousel-dots');
        var slides = track ? track.querySelectorAll('.carousel-slide') : [];
        if (slides.length === 0) return;

        var current = 0;
        var timer = null;
        var INTERVAL = 4000;
        var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // Build dots
        slides.forEach(function (_, i) {
          var dot = document.createElement('button');
          dot.className = 'carousel-dot' + (i === 0 ? ' active' : '');
          dot.setAttribute('role', 'tab');
          dot.setAttribute('aria-label', 'Imagem ' + (i + 1));
          dot.addEventListener('click', function () {
            goTo(i);
            resetTimer();
          });
          dotsContainer.appendChild(dot);
        });

        var dots = dotsContainer.querySelectorAll('.carousel-dot');

        function goTo(index) {
          slides[current].classList.remove('active');
          dots[current].classList.remove('active');
          current = (index + slides.length) % slides.length;
          slides[current].classList.add('active');
          dots[current].classList.add('active');
        }

        function next() {
          goTo(current + 1);
        }

        function startTimer() {
          if (reducedMotion) return;
          timer = setInterval(next, INTERVAL);
        }

        function resetTimer() {
          if (timer) clearInterval(timer);
          startTimer();
        }

        // Touch swipe
        var touchStartX = 0;
        var touchEndX = 0;

        carousel.addEventListener('touchstart', function (e) {
          touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        carousel.addEventListener('touchend', function (e) {
          touchEndX = e.changedTouches[0].screenX;
          var diff = touchStartX - touchEndX;
          if (Math.abs(diff) > 40) {
            if (diff > 0) { goTo(current + 1); } else { goTo(current - 1); }
            resetTimer();
          }
        }, { passive: true });

        // Pause on hover (desktop)
        carousel.addEventListener('mouseenter', function () {
          if (timer) clearInterval(timer);
        });

        carousel.addEventListener('mouseleave', function () {
          startTimer();
        });

        startTimer();
      }

      // ============================================
      // INIT
      // ============================================
      initBusinessStatus();
      initShare();
      initCarousel();
    })();
  </script>
</body>
</html>
